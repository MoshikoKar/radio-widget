<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Radio Widget — Settings</title>
  <link rel="stylesheet" href="flags/flags.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="settings-win">
  <div class="tabs" role="tablist"></div>

  <div class="tab-page" data-page="countries">
    <label class="search"><span data-icon="search"></span><input type="text" id="countrySearch" spellcheck="false" placeholder="" /></label>
    <div class="dd-list" id="countryList" role="listbox"></div>
  </div>
  <div class="tab-page" data-page="volume" hidden></div>
  <div class="tab-page" data-page="general" hidden></div>
  <div class="tab-page" data-page="update" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="bridge.js"></script>
  <script src="icons.js"></script>
  <script src="settings.js"></script>
</body>
</html>
